name: watchdog

on:
  schedule:
    # daily freshness check ~2h after monitor's full scan (03:23 UTC): validates the
    # scan caught everything and self-heals any miss automatically (no manual backfill)
    - cron: "13 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Run watchdog (probe + self-heal)
        id: watchdog
        run: python tools/watchdog.py --data data --notify-out watchdog-notify.json --changed-out watchdog-changed.json --send-email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}

      - name: Commit self-healed data
        if: hashFiles('watchdog-changed.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: watchdog self-heal archive update ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      - name: Open GitHub issue
        if: hashFiles('watchdog-notify.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('watchdog-notify.json',encoding='utf-8'))['title'])")
          python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('watchdog-notify.json',encoding='utf-8'))['body_md'])" > /tmp/issue-body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md

      # a failed probe/self-heal (exit 2) or pipeline failure (exit 1) must not be
      # silent: open one deduped alert Issue shared across monitor/monitor-fast/watchdog
      - name: Open alert issue (deduped)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --state open --search '守望先锋监控异常 in:title' --limit 100 --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "open alert issue exists; skipping"
          else
            gh issue create --title "守望先锋监控异常" \
              --body "看门狗失败于 $(date -u +%Y-%m-%dT%H:%MZ)。日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
