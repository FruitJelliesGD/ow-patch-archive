name: monitor

on:
  schedule:
    # daily full scan: catches edits to OLD patch notes (new patches are picked up
    # by monitor-fast every 30 minutes; watchdog self-heals any miss)
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Run pipeline (full scan of all months)
        id: pipeline
        run: python tools/run.py --data data --notify-out notify-full.json --changed-out notify-changed.json --send-email --fail-on-error
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}

      # any persisted data (new / real edit / cosmetic name-chrome drift) is committed;
      # cosmetic-only runs produce no notify file and therefore no Issue or email
      - name: Commit new/changed data
        if: hashFiles('notify-changed.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: full-scan archive update ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      - name: Open GitHub issue
        if: hashFiles('notify-full.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('notify-full.json',encoding='utf-8'))['title'])")
          python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('notify-full.json',encoding='utf-8'))['body_md'])" > /tmp/issue-body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md

      # a failed scan (fetch/parse errors surfaced by --fail-on-error) must not be
      # silent: open one deduped alert Issue shared across monitor/monitor-fast/watchdog
      - name: Open alert issue (deduped)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --state open --search '守望先锋监控异常 in:title' --limit 100 --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "open alert issue exists; skipping"
          else
            gh issue create --title "守望先锋监控异常" \
              --body "监控失败于 $(date -u +%Y-%m-%dT%H:%MZ)。日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
