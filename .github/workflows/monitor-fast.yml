name: monitor-fast

on:
  schedule:
    # GitHub Actions 最快支持每 5 分钟一次；只抓最近 2 个月，用于快速发现新补丁。
    # 注意：调度可能延迟数分钟；私有仓库 Actions 分钟数消耗较快（见 README）。
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-fast
  cancel-in-progress: false

jobs:
  monitor-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Run pipeline (fast scan: recent 2 months)
        id: pipeline
        run: python tools/run.py --data data --months 2 --notify-out notify-fast.json --send-email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}

      - name: Commit new/changed data
        if: hashFiles('notify-fast.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: fast-scan archive update ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      - name: Open GitHub issue
        if: hashFiles('notify-fast.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('notify-fast.json',encoding='utf-8'))['title'])")
          python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('notify-fast.json',encoding='utf-8'))['body_md'])" > /tmp/issue-body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
