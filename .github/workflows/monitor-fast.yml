name: monitor-fast

on:
  schedule:
    # GitHub Actions schedule 事件是 best-effort：*/5 实测中位数约 28 分钟才投递一次
    # （见 docs/compose/spec/monitor-hardening.md），*/30 与现实节奏一致。
    # 漏检由每日 watchdog 自愈兜底；告警 Issue 去重。
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-fast
  cancel-in-progress: false

jobs:
  monitor-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Run pipeline (fast scan of recent 2 months)
        id: pipeline
        run: python tools/run.py --data data --months 2 --notify-out notify-fast.json --changed-out notify-changed-fast.json --send-email --fail-on-error
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}

      - name: Download patch icons
        run: python tools/download_icons.py --data data --out web/assets --marker notify-icons-fast.json || true

      - name: Commit new/changed data
        if: hashFiles('notify-changed-fast.json') != '' || hashFiles('notify-icons-fast.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "data: fast-scan archive update ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - name: Open GitHub issue
        if: hashFiles('notify-fast.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('notify-fast.json',encoding='utf-8'))['title'])")
          python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('notify-fast.json',encoding='utf-8'))['body_md'])" > /tmp/issue-body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md

      # a failed scan (fetch/parse errors surfaced by --fail-on-error) must not be
      # silent: open one deduped alert Issue shared across monitor/monitor-fast/watchdog
      - name: Open alert issue (deduped)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --state open --search '守望先锋监控异常 in:title' --limit 100 --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "open alert issue exists; skipping"
          else
            gh issue create --title "守望先锋监控异常" \
              --body "监控失败于 $(date -u +%Y-%m-%dT%H:%MZ)。日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
