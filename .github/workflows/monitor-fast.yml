name: monitor-fast

on:
  schedule:
    # GitHub Actions schedule 事件是 best-effort：*/5 实测中位数约 28 分钟才投递一次
    # （见 docs/compose/spec/monitor-hardening.md），*/30 与现实节奏一致。
    # 漏检由每日 watchdog 自愈兜底；告警 Issue 去重。
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    # 本地 owpatch-tool 发现新补丁后立即触发本工作流（见 docs/compose/spec/local-dispatch.md）。
    # 归档仍由本工作流自行抓取官网，本地只提供"该跑了"的信号 + 日期校验。
    types: [owpatch-local-detect]

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-fast
  cancel-in-progress: false

jobs:
  monitor-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      # 触发来源的完整 payload 落到日志里，便于追溯"这次跑是本地工具叫起来的"
      - name: Show dispatch payload
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: echo "client_payload=$PAYLOAD"

      # 本地已推送过通知时跳过邮件（notify=false），避免双份提醒
      - name: Run pipeline (fast scan of recent 2 months)
        id: pipeline
        run: |
          python tools/run.py --data data --months 2 \
            --notify-out notify-fast.json \
            --changed-out notify-changed-fast.json \
            ${{ (github.event_name != 'repository_dispatch' || github.event.client_payload.notify) && '--send-email' || '' }} \
            --fail-on-error
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}

      - name: Download patch icons
        # icons/ is the tree the site reads (assets/icons/{heroes,abilities});
        # maps land one level up at web/assets/maps via out_dir.parent
        run: python tools/download_icons.py --data data --out web/assets/icons --marker notify-icons-fast.json || true

      - name: Optimize downloaded icons
        # new hero portraits arrive at 256px/~120KB; the script resizes them to
        # the size the site displays and skips anything already inside budget
        run: |
          pip install pillow --quiet || true
          python tools/optimize_assets.py || true

      # 被本地触发时校验"本地看到的日期"确实进了归档；解析坏掉不会静默变成全绿
      - name: Verify dispatched dates landed in the archive
        if: github.event_name == 'repository_dispatch'
        env:
          DATES: ${{ join(github.event.client_payload.dates, ' ') }}
          SITES: ${{ join(github.event.client_payload.sites, ' ') }}
        run: |
          python - <<'PY'
          import json, os, sys

          dates = [d for d in os.environ.get("DATES", "").split() if d]
          sites = [s for s in os.environ.get("SITES", "").split() if s]
          if not dates:
              print("no dates in payload; skip verification")
              sys.exit(0)
          sites = sites or ["en", "cn"]
          manifest = json.load(open("data/manifest.json", encoding="utf-8"))
          archived = {(v.get("site"), v.get("date"))
                      for v in manifest.values() if isinstance(v, dict)}
          missing = [(s, d) for s in sites for d in dates if (s, d) not in archived]
          if missing:
              print("ERROR: dispatched dates missing from archive:", missing)
              sys.exit(1)
          print("verified dispatched dates:", [f"{s} {d}" for s in sites for d in dates])
          PY

      - name: Commit new/changed data
        if: hashFiles('notify-changed-fast.json') != '' || hashFiles('notify-icons-fast.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "data: fast-scan archive update ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      # 本地触发的运行默认静默（本地工具已推送）；notify=true 时才照常开 Issue
      - name: Open GitHub issue
        if: |
          (github.event_name != 'repository_dispatch' || github.event.client_payload.notify == true) &&
          hashFiles('notify-fast.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('notify-fast.json',encoding='utf-8'))['title'])")
          python -c "import json,sys;sys.stdout.reconfigure(encoding='utf-8');print(json.load(open('notify-fast.json',encoding='utf-8'))['body_md'])" > /tmp/issue-body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md

      # a failed scan (fetch/parse errors surfaced by --fail-on-error) must not be
      # silent: open one deduped alert Issue shared across monitor/monitor-fast/watchdog
      - name: Open alert issue (deduped)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --state open --search '守望先锋监控异常 in:title' --limit 100 --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "open alert issue exists; skipping"
          else
            gh issue create --title "守望先锋监控异常" \
              --body "监控失败于 $(date -u +%Y-%m-%dT%H:%MZ)。日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
