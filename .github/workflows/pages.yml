name: pages

on:
  push:
    branches: [main]
  schedule:
    # monitor 的自动 commit 不触发 on:push（GITHUB_TOKEN 规则），用定时刷新兜底
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage site (web/ + data/)
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
