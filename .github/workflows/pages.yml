name: pages

on:
  push:
    branches: [main]
  # monitor 的自动 commit 不触发 on:push（GITHUB_TOKEN 规则）——改为在监控工作流
  # 完成后立即重建站点（数据已入库），schedule 仅作兜底
  workflow_run:
    workflows: [monitor, monitor-fast, watchdog, ai-translate]
    types: [completed]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # 轮询本次运行的 artifacts，确认 github-pages 产物已可见
  pages: write
  id-token: write

concurrency:
  # 排队而不取消：deploy-pages 被中途取消会让 Pages 部署停在中间状态
  # （历史上 6 次 cancelled 就是这种无意义的中断）。下一轮运行会撤销等待中的旧运行。
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 监控失败（--fail-on-error 退出非 0）时没有新数据落库，无需部署
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      - name: Stage site (web/ + the data files the site reads)
        # The site reads data/*.json plus data/patches, data/heroes and the
        # optional data/ai_translations overlay.
        # data/archive (Markdown, ~2.6 MB) and changelog.jsonl are for humans and
        # the CLI — shipping them would add dead weight to every deploy.
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          cp data/*.json _site/data/
          cp -r data/patches data/heroes data/ai_translations _site/data/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # 产物元数据在 GitHub 侧偶尔延迟可见：deploy-pages 会在上传成功后的几秒内
      # 报 "No artifacts named github-pages"，2026-11-17 起多次因此判红，而十几秒后
      # 同一份产物就能部署成功。先等它可见再部署；等待超时不算失败（后面还有 3 次
      # 部署重试），且只用 ::warning::，避免把一次成功的运行标成带错误注解。
      - name: Wait until the pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                 --jq '.artifacts[].name' 2>/dev/null | grep -qx 'github-pages'; then
              echo "github-pages artifact visible after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::github-pages artifact still not visible after 60s; deploying with retries"

      # 部署本身也保留重试：产物可见之后仍可能遇到 Pages 侧的瞬时错误。
      # 前两次失败只告警，3 次全失败才判红。
      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait 10s before retrying the deploy
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 10

      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait 20s before the final deploy attempt
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deploy_3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Fail only if every deploy attempt failed
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure'
        run: |
          echo "::error::actions/deploy-pages failed 3 times for run ${{ github.run_id }}; see the attempt steps above"
          exit 1
